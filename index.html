<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Player de Música Google Drive</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a1a; 
            color: #fff; 
            padding: 20px;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #2a2a2a; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; margin-bottom: 30px; color: #4285f4; }
        .g_id_signin { display: flex; justify-content: center; margin-bottom: 20px; }
        #authStatus { text-align: center; margin-bottom: 10px; color: #aaa; }
        
        button { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            background: #4285f4; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background: #357ae8; }
        button:disabled { background: #666; cursor: not-allowed; }
        
        #fileList { 
            list-style: none; 
            max-height: 300px; 
            overflow-y: auto; 
            margin: 20px 0;
        }
        .file-item { 
            padding: 12px; 
            margin: 8px 0; 
            background: #3a3a3a; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .file-item:hover { 
            background: #4285f4; 
            transform: translateX(5px);
        }
        .player { 
            margin-top: 20px; 
            padding: 20px; 
            background: #3a3a3a; 
            border-radius: 5px;
        }
        audio { width: 100%; margin: 15px 0; }
        .controls { text-align: center; margin: 20px 0; }
        .controls button { width: auto; padding: 10px 20px; margin: 5px; }
        #currentSong { color: #4285f4; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Meu Player de Música</h1>
        
        <!-- Novo botão de login do Google (GIS) -->
        <div id="g_id_onload"
             data-client_id="971917202294-uoohja221hvlpqm909m1322kterki4sm.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
        
        <p id="authStatus">Aguardando login...</p>
        <button id="loadMusicBtn" onclick="requestDriveAccess()" style="display:none;">Carregar Músicas do Drive</button>

        <div id="fileListContainer" style="display:none;">
            <h2 style="margin-top: 20px; font-size: 18px;">Suas Músicas:</h2>
            <ul id="fileList"></ul>
        </div>
        
        <div class="player" id="player" style="display: none;">
            <h2 id="currentSong"></h2>
            <audio id="audio" controls></audio>
            <div class="controls">
                <button id="prevBtn" onclick="prevSong()">⏮ Anterior</button>
                <button id="playPauseBtn" onclick="togglePlay()">▶ Play</button>
                <button id="nextBtn" onclick="nextSong()">Próxima ⏭</button>
                <button id="repeatBtn" onclick="toggleRepeat()">🔁 Repetir</button>
            </div>
        </div>
    </div>

    <!-- Novas Bibliotecas do Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    
    <script>
        const CLIENT_ID = '971917202294-uoohja221hvlpqm909m1322kterki4sm.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyARKQirDe2_IZazq8Ium3szo-l79PscszA';
        const DISCOVERY_DOCS = ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'];
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

        let currentIndex = 0;
        let playlist = [];
        let isRepeat = false;
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let driveAccessToken = null;

        // 1. Inicializa a API clássica (apenas para acessar o Drive, não para login)
        function gapiLoaded() {
            gapi.load('client', intializeGapiClient);
        }

        async function intializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: DISCOVERY_DOCS,
            });
            gapiInited = true;
            checkReady();
        }

        // 2. Callback de quando o botão do Google é clicado (Login)
        function handleCredentialResponse(response) {
            console.log("Login com Google bem sucedido!");
            document.getElementById('authStatus').textContent = "Usuário autenticado. Clique abaixo para carregar as músicas.";
            document.querySelector('.g_id_signin').style.display = 'none';
            
            // Agora que logou, pedimos a permissão extra para o Drive
            initTokenClient();
        }

        // 3. Pede permissão para acessar o Google Drive do usuário logado
        function initTokenClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        driveAccessToken = tokenResponse.access_token;
                        document.getElementById('loadMusicBtn').style.display = 'block';
                        document.getElementById('authStatus').textContent = "Acesso ao Drive permitido!";
                        listAudioFiles(); // Já tenta carregar as músicas direto
                    }
                },
            });
            gisInited = true;
            checkReady();
            
            // Solicita o popup de permissão do Drive assim que logar
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        function requestDriveAccess() {
             tokenClient.requestAccessToken({prompt: ''});
        }

        function checkReady() {
            if (gapiInited && gisInited) {
                console.log("Pronto para uso");
            }
        }

        function listAudioFiles() {
            document.getElementById('authStatus').textContent = "Carregando músicas...";
            gapi.client.drive.files.list({
                q: "mimeType contains 'audio/' or mimeType='video/mp4'",
                fields: 'files(id, name, mimeType)',
                pageSize: 100
            }).then(response => {
                playlist = response.result.files || [];
                displayFiles(playlist);
                document.getElementById('authStatus').textContent = playlist.length + " músicas carregadas.";
            }).catch(error => {
                console.error('Erro ao listar arquivos:', error);
                document.getElementById('authStatus').textContent = "Erro ao acessar o Drive.";
            });
        }

        function displayFiles(files) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            document.getElementById('fileListContainer').style.display = 'block';
            
            if (files.length === 0) {
                fileList.innerHTML = '<li class="file-item">Nenhuma música encontrada no Drive</li>';
                return;
            }
            files.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.textContent = file.name;
                li.onclick = () => playSong(index);
                fileList.appendChild(li);
            });
        }

        function playSong(index) {
            currentIndex = index;
            const file = playlist[currentIndex];
            const audio = document.getElementById('audio');
            
            // Adiciona o token de acesso na URL para baixar a mídia
            audio.src = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`;
            
            // É necessário passar o token no header (não apenas na URL) com a nova API
            fetch(audio.src, {
                headers: new Headers({
                    'Authorization': 'Bearer ' + driveAccessToken
                })
            })
            .then(response => response.blob())
            .then(blob => {
                const url = URL.createObjectURL(blob);
                audio.src = url;
                audio.play();
                document.getElementById('currentSong').textContent = '♫ ' + file.name;
                document.getElementById('player').style.display = 'block';
                document.getElementById('playPauseBtn').textContent = '⏸ Pausa';
            });
        }

        function togglePlay() {
             const audio = document.getElementById('audio');
             const btn = document.getElementById('playPauseBtn');
             if (audio.paused) {
                 audio.play();
                 btn.textContent = '⏸ Pausa';
             } else {
                 audio.pause();
                 btn.textContent = '▶ Play';
             }
         }

         function nextSong() {
             if (playlist.length > 0) {
                 currentIndex = (currentIndex + 1) % playlist.length;
                 playSong(currentIndex);
             }
         }

         function prevSong() {
             if (playlist.length > 0) {
                 currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                 playSong(currentIndex);
             }
         }

         function toggleRepeat() {
             isRepeat = !isRepeat;
             const btn = document.getElementById('repeatBtn');
             btn.textContent = isRepeat ? '🔁 Repetir (On)' : '🔁 Repetir';
         }

         document.getElementById('audio').addEventListener('ended', () => {
             if (isRepeat) {
                 playSong(currentIndex);
             } else {
                 nextSong();
             }
         });

        // Carrega o GAPI no boot da página
        window.onload = function () {
            gapiLoaded();
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
