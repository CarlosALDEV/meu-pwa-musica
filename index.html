<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS Music - Dr. Sylvio Sacramento</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .topbar {
            background-color: #000000;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #282828;
            flex-shrink: 0;
            z-index: 10;
        }
        
        .topbar img {
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .brand-info {
            display: flex;
            flex-direction: column;
        }
        
        .brand-info h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        
        .brand-info p {
            margin: 2px 0 0 0;
            font-size: 12px;
            font-weight: 500;
            color: #4285F4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .auth-container {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        #authStatus {
            font-size: 13px;
            color: #b3b3b3;
        }
        
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: linear-gradient(180deg, #1e1e1e 0%, #121212 100%);
            padding-bottom: 120px;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            height: 40px;
        }
        
        .back-button {
            background-color: rgba(0,0,0,0.6);
            color: #ffffff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        
        .back-button:hover {
            background-color: #282828;
            transform: scale(1.05);
        }
        
        .folder-title {
            margin-left: 15px;
            font-size: 24px;
            font-weight: 700;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }
        
        .card {
            background-color: #181818;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        
        .card:hover {
            background-color: #282828;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        
        .card-image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 16px;
            border-radius: 6px;
            overflow: hidden;
            background-color: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card .icon-placeholder {
            font-size: 60px;
            color: #b3b3b3;
        }
        
        .card.folder .icon-placeholder {
            color: #4285F4;
        }
        
        .card h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card p {
            margin: 0;
            font-size: 13px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-hover-btn {
            position: absolute;
            bottom: 60px;
            right: 20px;
            width: 48px;
            height: 48px;
            background-color: #4285F4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            border: none;
            padding-left: 3px;
            cursor: pointer;
        }

        .card:not(.folder):hover .play-hover-btn {
            opacity: 1;
            transform: translateY(0);
        }
        
        .play-hover-btn:hover {
            transform: scale(1.05) !important;
            background-color: #357ae8;
        }

        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 30;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .video-modal.active {
            display: flex;
        }

        .video-container {
            width: 90%;
            max-width: 800px;
            position: relative;
        }

        .video-container video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .close-video-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #4285F4;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 31;
        }

        .close-video-btn:hover {
            background: #357ae8;
            transform: scale(1.05);
        }

        .player-bar {
            background-color: #181818;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            border-top: 1px solid #282828;
            z-index: 20;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            width: 30%;
            min-width: 200px;
            cursor: pointer;
        }
        
        .player-info .thumb {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            background-color: #282828;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.2s;
        }

        .player-info:hover .thumb {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }
        
        .player-info .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .player-info .thumb i {
            color: #b3b3b3;
            font-size: 24px;
        }
        
        .player-info-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .player-info-text h4 {
            margin: 0 0 3px 0;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .player-info-text p {
            margin: 0;
            font-size: 11px;
            color: #b3b3b3;
        }
        
        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
            max-width: 722px;
        }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .controls button {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        
        .controls button:hover {
            color: #ffffff;
        }
        
        .controls button.active {
            color: #4285F4;
        }
        
        .controls .btn-play-pause {
            background-color: #ffffff;
            color: #000000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            padding-left: 2px;
        }
        
        .controls .btn-play-pause:hover {
            transform: scale(1.05);
            background-color: #ffffff;
            color: #000000;
        }

        .player-right {
            width: 30%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-control input {
            width: 80px;
            height: 4px;
            cursor: pointer;
            accent-color: #4285F4;
        }

        .volume-control i {
            color: #b3b3b3;
            font-size: 14px;
        }

        #g_id_onload { display: none; }
        
        .main-content::-webkit-scrollbar { width: 10px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: #b3b3b3; }

        .error-message {
            background-color: #ff4444;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <img src="logo.png" id="logoApp" alt="SS Music Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%234285F4\'/><text x=\'50\' y=\'55\' font-family=\'Arial\' font-size=\'40\' fill=\'white\' text-anchor=\'middle\' font-weight=\'bold\' dominant-baseline=\'middle\'>SS</text></svg>'">
        
        <div class="brand-info">
            <h1>SS Music</h1>
            <p>Dr. Sylvio Sacramento</p>
        </div>
        
        <div class="auth-container">
            <span id="authStatus">Aguardando login...</span>
            <div id="gis-button-container">
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
            </div>
            <button id="authFallbackBtn" onclick="requestDriveAccess()" style="display:none; padding:8px 15px; border-radius:20px; background:#4285F4; border:none; color:white; font-weight:bold; cursor:pointer;">Conectar Drive</button>
        </div>
        
        <div id="g_id_onload"
             data-client_id="971917202294-uoohja221hvlpqm909m1322kterki4sm.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;">
        <div class="error-message" id="errorMessage"></div>
        
        <div class="header-actions">
            <button id="btnVoltar" class="back-button" onclick="goBack()" style="display: none;" title="Voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h2 id="currentFolderName" class="folder-title">Início</h2>
        </div>
        
        <div id="fileGrid" class="grid"></div>
    </div>

    <div class="video-modal" id="videoModal">
        <button class="close-video-btn" onclick="closeVideoModal()">
            <i class="fa-solid fa-times"></i>
        </button>
        <div class="video-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <div class="player-bar">
        <audio id="audio" style="display: none;"></audio>
        
        <div class="player-info" onclick="openVideoModal()">
            <div class="thumb" id="playerThumb">
                <i class="fa-solid fa-music"></i>
            </div>
            <div class="player-info-text">
                <h4 id="playerTitle">Nenhuma música</h4>
                <p id="playerArtist">Selecione para tocar</p>
            </div>
        </div>
        
        <div class="player-center">
            <div class="controls">
                <button id="prevBtn" onclick="prevSong()" title="Anterior"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playPauseBtn" class="btn-play-pause" onclick="togglePlay()" title="Play/Pause"><i class="fa-solid fa-play" id="playIcon"></i></button>
                <button id="nextBtn" onclick="nextSong()" title="Próxima"><i class="fa-solid fa-forward-step"></i></button>
                <button id="repeatBtn" onclick="toggleRepeat()" title="Repetir"><i class="fa-solid fa-repeat"></i></button>
            </div>
        </div>
        
        <div class="player-right">
            <div class="volume-control">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="100" onchange="changeVolume()">
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    
    <script>
        const CLIENT_ID = '971917202294-uoohja221hvlpqm909m1322kterki4sm.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyARKQirDe2_IZazq8Ium3szo-l79PscszA';
        const DISCOVERY_DOCS = ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'];
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

        let currentIndex = -1;
        let playlist = [];
        let allFilesRaw = [];
        let isRepeat = false;
        let isLoading = false;
        let isApiReady = false; // ✅ NOVO: Flag para garantir API inicializada
        
        let tokenClient;
        let driveAccessToken = null;
        let folderHistory = [{id: 'root', name: 'Início'}];
        let currentFolderId = 'root';
        let currentFileData = null;

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function gapiLoaded() {
            gapi.load('client', intializeGapiClient);
        }

        async function intializeGapiClient() {
            try {
                await gapi.client.init({
                    apiKey: API_KEY,
                    discoveryDocs: DISCOVERY_DOCS,
                });
                isApiReady = true; // ✅ Marca como pronto
                console.log("✅ gapi.client initialized successfully");
            } catch(err) {
                console.error("❌ Erro ao inicializar gapi:", err);
                showError("Erro ao inicializar API do Google");
            }
        }

        function handleCredentialResponse(response) {
            document.getElementById('authStatus').textContent = "Pronto para autorizar.";
            document.getElementById('gis-button-container').style.display = 'none';
            document.getElementById('authFallbackBtn').style.display = 'block';
            initTokenClient();
        }

        function initTokenClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        driveAccessToken = tokenResponse.access_token;
                        document.getElementById('authFallbackBtn').style.display = 'none';
                        document.getElementById('authStatus').textContent = "Conectado. Bem-vindo!";
                        document.getElementById('authStatus').style.color = "#4285F4";
                        
                        document.getElementById('mainContent').style.display = 'block';
                        listFiles('root', 'Início'); 
                    }
                },
            });
            requestDriveAccess();
        }

        function requestDriveAccess() {
             tokenClient.requestAccessToken({prompt: 'consent'}); 
        }

        // ✅ FUNÇÃO CORRIGIDA: Não reinicializa a API
        function listFiles(folderId, folderName) {
            // Verifica se a API está pronta
            if (!isApiReady) {
                showError("API do Google ainda não está pronta. Aguarde...");
                return;
            }

            // Se já está carregando, não faz nova requisição
            if (isLoading) {
                console.log("⏳ Já está buscando arquivos, aguarde...");
                return;
            }

            isLoading = true;
            document.getElementById('authStatus').textContent = "🔍 Buscando arquivos...";
            
            const query = `'${folderId}' in parents and (mimeType contains 'audio/' or mimeType='video/mp4' or mimeType='application/vnd.google-apps.folder') and trashed = false`;

            // ✅ NÃO reinicializa: apenas faz a requisição
            gapi.client.drive.files.list({
                q: query,
                fields: 'files(id, name, mimeType, thumbnailLink)',
                orderBy: 'folder, name', 
                pageSize: 1000,
                spaces: 'drive'
            }).then(response => {
                isLoading = false; // ✅ Libera para nova busca
                allFilesRaw = response.result.files || [];
                displayFiles(folderName);
                document.getElementById('authStatus').textContent = "";
                console.log("✅ Arquivos carregados:", allFilesRaw.length);
            }).catch(error => {
                isLoading = false; // ✅ Libera mesmo em erro
                console.error('❌ Erro ao listar:', error);
                showError("Erro ao buscar arquivos: " + (error.result?.error?.message || "Erro desconhecido"));
                document.getElementById('authStatus').textContent = "❌ Erro ao buscar arquivos";
            });
        }

        function displayFiles(folderName) {
            const grid = document.getElementById('fileGrid');
            grid.innerHTML = '';
            
            document.getElementById('currentFolderName').textContent = folderName;
            
            if (folderHistory.length > 1) {
                document.getElementById('btnVoltar').style.display = 'flex';
            } else {
                document.getElementById('btnVoltar').style.display = 'none';
            }

            playlist = allFilesRaw.filter(f => f.mimeType !== 'application/vnd.google-apps.folder');

            if (allFilesRaw.length === 0) {
                grid.innerHTML = '<p style="color:#b3b3b3;">Esta pasta está vazia.</p>';
                return;
            }

            allFilesRaw.forEach(file => {
                const card = document.createElement('div');
                card.className = 'card' + (file.mimeType === 'application/vnd.google-apps.folder' ? ' folder' : '');
                
                let imageHtml = '';
                
                if (file.mimeType === 'application/vnd.google-apps.folder') {
                    imageHtml = `<div class="card-image-container"><i class="fa-solid fa-folder icon-placeholder"></i></div>`;
                    card.onclick = () => openFolder(file.id, file.name);
                } else {
                    if (file.thumbnailLink) {
                        imageHtml = `<div class="card-image-container"><img src="${file.thumbnailLink}" alt="Capa"></div>`;
                    } else {
                        imageHtml = `<div class="card-image-container"><i class="fa-solid fa-music icon-placeholder"></i></div>`;
                    }
                    
                    imageHtml += `<button class="play-hover-btn"><i class="fa-solid fa-play"></i></button>`;
                    
                    const pIndex = playlist.findIndex(p => p.id === file.id);
                    card.onclick = () => playSong(pIndex);
                }

                card.innerHTML = `
                    ${imageHtml}
                    <h3>${file.name.replace(/\.[^/.]+$/, "")}</h3>
                    <p>${file.mimeType === 'application/vnd.google-apps.folder' ? 'Pasta' : 'SS Music'}</p>
                `;
                
                grid.appendChild(card);
            });
        }

        function openFolder(folderId, folderName) {
            folderHistory.push({id: folderId, name: folderName});
            currentFolderId = folderId;
            listFiles(folderId, folderName);
        }

        function goBack() {
            if (folderHistory.length > 1) {
                folderHistory.pop();
                const prevFolder = folderHistory[folderHistory.length - 1];
                currentFolderId = prevFolder.id;
                listFiles(prevFolder.id, prevFolder.name);
            }
        }

        function updatePlayerUI(file) {
            document.getElementById('playerTitle').textContent = file.name.replace(/\.[^/.]+$/, "");
            document.getElementById('playerArtist').textContent = 'Dr. Sylvio Sacramento';
            
            const thumbDiv = document.getElementById('playerThumb');
            if (file.thumbnailLink) {
                thumbDiv.innerHTML = `<img src="${file.thumbnailLink}">`;
            } else {
                thumbDiv.innerHTML = `<i class="fa-solid fa-music"></i>`;
            }
            
            const playIcon = document.getElementById('playIcon');
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
            document.getElementById('playPauseBtn').style.paddingLeft = '0px';
        }

        function playSong(index) {
            if(isLoading) return; // ✅ Não deixa clicar enquanto carrega
            if(index < 0 || index >= playlist.length) return;
            
            isLoading = true;
            currentIndex = index;
            const file = playlist[currentIndex];
            const audio = document.getElementById('audio');
            
            updatePlayerUI(file);
            currentFileData = file;
            
            audio.src = `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`;
            
            fetch(audio.src, {
                headers: new Headers({
                    'Authorization': 'Bearer ' + driveAccessToken
                })
            })
            .then(response => response.blob())
            .then(blob => {
                const url = URL.createObjectURL(blob);
                audio.src = url;
                audio.play();
                isLoading = false;
            }).catch(err => {
                console.log("❌ Erro no fetch do audio: ", err);
                document.getElementById('playerTitle').textContent = "Erro ao carregar mídia";
                isLoading = false;
            });
        }

        function togglePlay() {
             const audio = document.getElementById('audio');
             const playIcon = document.getElementById('playIcon');
             const btn = document.getElementById('playPauseBtn');
             
             if(!audio.src) return;

             if (audio.paused) {
                 audio.play();
                 playIcon.classList.remove('fa-play');
                 playIcon.classList.add('fa-pause');
                 btn.style.paddingLeft = '0px';
             } else {
                 audio.pause();
                 playIcon.classList.remove('fa-pause');
                 playIcon.classList.add('fa-play');
                 btn.style.paddingLeft = '2px';
             }
         }

         function nextSong() {
             if (playlist.length > 0) {
                 currentIndex = (currentIndex + 1) % playlist.length;
                 playSong(currentIndex);
             }
         }

         function prevSong() {
             if (playlist.length > 0) {
                 currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                 playSong(currentIndex);
             }
         }

         function toggleRepeat() {
             isRepeat = !isRepeat;
             const btn = document.getElementById('repeatBtn');
             if(isRepeat) {
                 btn.classList.add('active');
             } else {
                 btn.classList.remove('active');
             }
         }

         function changeVolume() {
             const audio = document.getElementById('audio');
             const volumeSlider = document.getElementById('volumeSlider');
             audio.volume = volumeSlider.value / 100;
         }

         function openVideoModal() {
             if(!currentFileData || !currentFileData.thumbnailLink) return;
             
             const videoPlayer = document.getElementById('videoPlayer');
             videoPlayer.src = `https://www.googleapis.com/drive/v3/files/${currentFileData.id}?alt=media`;
             
             const audio = document.getElementById('audio');
             videoPlayer.currentTime = audio.currentTime;
             
             if(!audio.paused) {
                 videoPlayer.play();
             }
             
             document.getElementById('videoModal').classList.add('active');
         }

         function closeVideoModal() {
             const videoPlayer = document.getElementById('videoPlayer');
             videoPlayer.pause();
             document.getElementById('videoModal').classList.remove('active');
         }

         document.getElementById('audio').addEventListener('ended', () => {
             if (isRepeat) {
                 playSong(currentIndex);
             } else {
                 nextSong();
             }
         });

         document.getElementById('audio').addEventListener('play', () => {
             const videoPlayer = document.getElementById('videoPlayer');
             if(videoPlayer.src) {
                 videoPlayer.play();
             }
         });

         document.getElementById('audio').addEventListener('pause', () => {
             const videoPlayer = document.getElementById('videoPlayer');
             if(videoPlayer.src) {
                 videoPlayer.pause();
             }
         });
         
         if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', togglePlay);
            navigator.mediaSession.setActionHandler('pause', togglePlay);
            navigator.mediaSession.setActionHandler('previoustrack', prevSong);
            navigator.mediaSession.setActionHandler('nexttrack', nextSong);
         }

        window.onload = function () {
            gapiLoaded();
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
